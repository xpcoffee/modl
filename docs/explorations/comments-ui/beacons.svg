<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="ui-monospace, monospace">
  <rect width="920" height="560" fill="#12141a"/>

  <!-- board -->
  <g>
    <rect x="120" y="120" width="150" height="64" rx="10" fill="#1b1e26" stroke="#5b8def" stroke-width="1.5"/>
    <text x="195" y="156" fill="#e6e8ee" font-size="13" text-anchor="middle">Checkout UI</text>

    <rect x="430" y="120" width="160" height="64" rx="10" fill="#1b1e26" stroke="#5b8def" stroke-width="1.5"/>
    <text x="510" y="156" fill="#e6e8ee" font-size="13" text-anchor="middle">Payment gateway</text>

    <rect x="430" y="340" width="150" height="64" rx="10" fill="#1b1e26" stroke="#2c313d"/>
    <text x="505" y="376" fill="#8b93a7" font-size="13" text-anchor="middle">Ledger</text>

    <path d="M 270 152 C 330 152, 370 152, 430 152" stroke="#5b8def" stroke-width="1.5" fill="none"/>
    <path d="M 510 184 C 510 250, 505 290, 505 340" stroke="#2c313d" stroke-width="1.5" fill="none"/>
  </g>

  <!-- one beacon at the centroid of its two targets, tethered to each -->
  <g>
    <path d="M 352 236 L 195 186" stroke="#e0a94f" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M 352 236 L 505 186" stroke="#e0a94f" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="352" cy="236" r="16" fill="none" stroke="#e0a94f" stroke-width="1" opacity="0.4"/>
    <path d="M 352 224 L 364 236 L 352 248 L 340 236 Z" fill="#1b1e26" stroke="#e0a94f" stroke-width="1.8"/>
    <text x="352" y="241" fill="#e0a94f" font-size="10" text-anchor="middle">2</text>
  </g>

  <!-- its open holo-card -->
  <g>
    <path d="M 368 236 L 400 236" stroke="#e0a94f" stroke-width="1"/>
    <rect x="400" y="206" width="238" height="76" rx="8" fill="#1b1e26" stroke="#e0a94f" stroke-width="1.2"/>
    <text x="414" y="228" fill="#e0a94f" font-size="10">BEACON 2/5 · 11:02 · 2 elements</text>
    <text x="414" y="248" fill="#e6e8ee" font-size="11">retry on timeout is assumed</text>
    <text x="414" y="263" fill="#e6e8ee" font-size="11">here – confirm with gateway ✎</text>
  </g>

  <!-- a single-target beacon on the ledger -->
  <path d="M 580 330 L 592 342 L 580 354 L 568 342 Z" fill="#1b1e26" stroke="#e0a94f" stroke-width="1.5"/>

  <!-- a general comment orbiting the board edge -->
  <circle cx="828" cy="96" r="10" fill="none" stroke="#e0a94f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="828" cy="96" r="3" fill="#e0a94f"/>
  <text x="828" y="126" fill="#8b93a7" font-size="10" text-anchor="middle">general remark</text>

  <!-- beacon tray: the chronological tour -->
  <rect x="240" y="486" width="440" height="44" rx="22" fill="#1b1e26" stroke="#2c313d"/>
  <text x="272" y="513" fill="#8b93a7" font-size="14">◀</text>
  <g transform="translate(320 508)">
    <path d="M 0 -7 L 7 0 L 0 7 L -7 0 Z" fill="#2c313d"/>
    <path d="M 40 -7 L 47 0 L 40 7 L 33 0 Z" fill="#e0a94f"/>
    <path d="M 80 -7 L 87 0 L 80 7 L 73 0 Z" fill="#2c313d"/>
    <path d="M 120 -7 L 127 0 L 120 7 L 113 0 Z" fill="#2c313d"/>
    <path d="M 160 -7 L 167 0 L 160 7 L 153 0 Z" fill="#2c313d"/>
  </g>
  <text x="560" y="513" fill="#e0a94f" font-size="12">2 / 5</text>
  <text x="640" y="513" fill="#8b93a7" font-size="14">▶</text>

  <text x="120" y="470" fill="#8b93a7" font-size="11">◀ ▶ flies the camera beacon to beacon, in the order they were written</text>
</svg>
