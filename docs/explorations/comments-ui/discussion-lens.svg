<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="ui-monospace, monospace">
  <rect width="920" height="560" fill="#12141a"/>

  <!-- mode toggle -->
  <g>
    <rect x="360" y="20" width="200" height="30" rx="15" fill="#1b1e26" stroke="#2c313d"/>
    <text x="410" y="40" fill="#8b93a7" font-size="11" text-anchor="middle">MODEL</text>
    <rect x="460" y="23" width="97" height="24" rx="12" fill="#e0a94f"/>
    <text x="508" y="40" fill="#12141a" font-size="11" text-anchor="middle">DISCUSSION</text>
  </g>

  <!-- board as blueprint: dimmed, dashed -->
  <g opacity="0.45">
    <rect x="100" y="130" width="150" height="64" rx="10" fill="none" stroke="#5b8def" stroke-dasharray="6 4"/>
    <text x="175" y="166" fill="#8b93a7" font-size="13" text-anchor="middle">Checkout UI</text>

    <rect x="410" y="130" width="160" height="64" rx="10" fill="none" stroke="#5b8def" stroke-dasharray="6 4"/>
    <text x="490" y="166" fill="#8b93a7" font-size="13" text-anchor="middle">Payment gateway</text>

    <rect x="410" y="330" width="150" height="64" rx="10" fill="none" stroke="#5b8def" stroke-dasharray="6 4"/>
    <text x="485" y="366" fill="#8b93a7" font-size="13" text-anchor="middle">Ledger</text>

    <path d="M 250 162 C 310 162, 350 162, 410 162" stroke="#5b8def" stroke-width="1" fill="none" stroke-dasharray="6 4"/>
    <path d="M 490 194 C 490 250, 485 280, 485 330" stroke="#5b8def" stroke-width="1" fill="none" stroke-dasharray="6 4"/>
  </g>

  <!-- comments at full strength: one card, arcs to both targets -->
  <g>
    <rect x="230" y="216" width="230" height="70" rx="8" fill="#1b1e26" stroke="#e0a94f" stroke-width="1.5"/>
    <text x="244" y="236" fill="#e0a94f" font-size="10">#2 · 11:02 · 2 elements</text>
    <text x="244" y="256" fill="#e6e8ee" font-size="11">retry on timeout is assumed</text>
    <text x="244" y="271" fill="#e6e8ee" font-size="11">here – confirm with gateway ✎</text>
    <path d="M 250 216 C 210 206, 190 200, 175 194" stroke="#e0a94f" stroke-width="1.2" fill="none"/>
    <path d="M 440 216 C 470 208, 480 202, 490 194" stroke="#e0a94f" stroke-width="1.2" fill="none"/>
  </g>

  <!-- single-target card, unlit (not the scrubber's current stop) -->
  <g opacity="0.6">
    <rect x="600" y="352" width="170" height="48" rx="8" fill="#1b1e26" stroke="#e0a94f"/>
    <text x="612" y="372" fill="#e0a94f" font-size="10">#3 · 11:40</text>
    <text x="612" y="389" fill="#e6e8ee" font-size="11">rename the ledger</text>
    <path d="M 600 372 C 585 370, 572 368, 560 366" stroke="#e0a94f" stroke-width="1" fill="none"/>
  </g>

  <!-- general remarks dock -->
  <g opacity="0.85">
    <rect x="700" y="90" width="190" height="54" rx="8" fill="#1b1e26" stroke="#2c313d"/>
    <text x="712" y="110" fill="#8b93a7" font-size="10">((•)) #1 · 09:14 · whole board</text>
    <text x="712" y="128" fill="#e6e8ee" font-size="11">split payments/fulfilment?</text>
  </g>

  <!-- timeline scrubber -->
  <g>
    <line x1="140" y1="500" x2="780" y2="500" stroke="#2c313d" stroke-width="4" stroke-linecap="round"/>
    <line x1="240" y1="492" x2="240" y2="508" stroke="#8b93a7"/>
    <line x1="420" y1="492" x2="420" y2="508" stroke="#8b93a7"/>
    <line x1="600" y1="492" x2="600" y2="508" stroke="#8b93a7"/>
    <circle cx="420" cy="500" r="10" fill="#e0a94f"/>
    <text x="420" y="532" fill="#e0a94f" font-size="10" text-anchor="middle">11:02</text>
    <text x="140" y="480" fill="#8b93a7" font-size="10">09:14</text>
    <text x="780" y="480" fill="#8b93a7" font-size="10" text-anchor="end">11:40</text>
  </g>

  <text x="100" y="456" fill="#8b93a7" font-size="11">dragging the scrubber steps through the discussion in order, panning to each card</text>
</svg>
