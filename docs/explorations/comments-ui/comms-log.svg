<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="ui-monospace, monospace">
  <rect width="920" height="560" fill="#12141a"/>

  <!-- board -->
  <g>
    <rect x="60" y="120" width="150" height="64" rx="10" fill="#1b1e26" stroke="#5b8def" stroke-width="1.5"/>
    <text x="135" y="156" fill="#e6e8ee" font-size="13" text-anchor="middle">Checkout UI</text>

    <rect x="300" y="120" width="160" height="64" rx="10" fill="#1b1e26" stroke="#5b8def" stroke-width="1.5"/>
    <text x="380" y="156" fill="#e6e8ee" font-size="13" text-anchor="middle">Payment gateway</text>

    <rect x="300" y="330" width="150" height="64" rx="10" fill="#1b1e26" stroke="#2c313d" opacity="0.35"/>
    <text x="375" y="366" fill="#8b93a7" font-size="13" text-anchor="middle" opacity="0.5">Ledger</text>

    <path d="M 210 152 C 250 152, 260 152, 300 152" stroke="#5b8def" stroke-width="1.5" fill="none"/>
    <path d="M 380 184 C 380 240, 375 280, 375 330" stroke="#2c313d" stroke-width="1.5" fill="none" opacity="0.4"/>
    <text x="253" y="143" fill="#8b93a7" font-size="10" text-anchor="middle">authorise</text>
  </g>

  <!-- leader lines from the selected transmission to its targets -->
  <g stroke="#e0a94f" stroke-width="1.2" stroke-dasharray="5 4" fill="none" opacity="0.9">
    <path d="M 620 208 C 520 210, 240 230, 152 184"/>
    <path d="M 620 214 C 540 230, 440 220, 392 184"/>
  </g>
  <circle cx="152" cy="184" r="3.5" fill="#e0a94f"/>
  <circle cx="392" cy="184" r="3.5" fill="#e0a94f"/>

  <!-- comms rail -->
  <rect x="620" y="0" width="300" height="560" fill="#1b1e26" stroke="#2c313d"/>
  <text x="640" y="34" fill="#e0a94f" font-size="13" letter-spacing="3">▸ COMMS LOG</text>
  <text x="884" y="34" fill="#8b93a7" font-size="13" text-anchor="end">⟩⟩</text>
  <line x1="620" y1="48" x2="920" y2="48" stroke="#2c313d"/>

  <!-- broadcast entry (general comment) -->
  <g>
    <rect x="636" y="64" width="268" height="66" rx="8" fill="#12141a" stroke="#2c313d"/>
    <text x="650" y="84" fill="#8b93a7" font-size="10">((•)) BROADCAST · 09:14</text>
    <text x="650" y="104" fill="#e6e8ee" font-size="11">should this board split into</text>
    <text x="650" y="119" fill="#e6e8ee" font-size="11">payments and fulfilment?</text>
  </g>

  <!-- selected transmission, aimed at two elements -->
  <g>
    <rect x="636" y="146" width="268" height="96" rx="8" fill="#12141a" stroke="#e0a94f" stroke-width="1.5"/>
    <text x="650" y="166" fill="#e0a94f" font-size="10">◍ TRANSMISSION · 11:02</text>
    <text x="650" y="186" fill="#e6e8ee" font-size="11">retry on timeout is assumed</text>
    <text x="650" y="201" fill="#e6e8ee" font-size="11">here – confirm with gateway</text>
    <rect x="650" y="212" width="86" height="18" rx="9" fill="#1b1e26" stroke="#e0a94f" opacity="0.9"/>
    <text x="693" y="225" fill="#e0a94f" font-size="9" text-anchor="middle">Checkout UI</text>
    <rect x="742" y="212" width="76" height="18" rx="9" fill="#1b1e26" stroke="#e0a94f" opacity="0.9"/>
    <text x="780" y="225" fill="#e0a94f" font-size="9" text-anchor="middle">gateway</text>
  </g>

  <!-- older entry -->
  <g opacity="0.75">
    <rect x="636" y="258" width="268" height="52" rx="8" fill="#12141a" stroke="#2c313d"/>
    <text x="650" y="278" fill="#8b93a7" font-size="10">◍ TRANSMISSION · 11:40</text>
    <text x="650" y="296" fill="#e6e8ee" font-size="11">rename the ledger</text>
  </g>

  <!-- composer -->
  <rect x="636" y="472" width="268" height="48" rx="8" fill="#12141a" stroke="#2c313d"/>
  <text x="650" y="500" fill="#8b93a7" font-size="11">transmit… (2 elements targeted)</text>
  <rect x="820" y="480" width="72" height="30" rx="8" fill="#e0a94f"/>
  <text x="856" y="500" fill="#12141a" font-size="11" text-anchor="middle">SEND</text>

  <text x="60" y="520" fill="#8b93a7" font-size="11">selecting a transmission mutes the rest of the board and traces lines to its targets</text>
</svg>
